<!DOCTYPE html>
<html>
<head>
  <title>Rathnasri's Fun Game Hub</title>
  <style>
    body {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7, #a1c4fd, #c2e9fb, #fbc2eb, #fad0c4);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    @keyframes gradientBG {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }
    h1 {
      color: #fff;
      font-size: 3em;
      padding: 20px;
      text-shadow: 3px 3px 8px #000;
      animation: bounce 2s infinite;
    }
    @keyframes bounce {
      0%, 100% {transform: translateY(0);}
      50% {transform: translateY(-10px);}
    }
    p {
      color: #fff;
      font-size: 1.5em;
      margin-top: 10px;
    }
    ul {
      list-style-type: none;
      padding: 0;
      margin-top: 40px;
    }
    li {
      margin: 25px 0;
    }
    a {
      text-decoration: none;
      color: #fff;
      background: linear-gradient(45deg, #ff6a00, #ffcc00, #ff0099, #00dbde, #fc00ff);
      background-size: 300% 300%;
      padding: 15px 40px;
      border-radius: 50px;
      font-size: 1.3em;
      font-weight: bold;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      transition: transform 0.4s, background-position 0.4s;
      display: inline-block;
    }
    a:hover {
      transform: rotate(-5deg) scale(1.1);
      background-position: right center;
    }
  </style>
</head>
<body>
  <h1>🌈 Rathnasri's Fun Game Hub 🎮</h1>
  <p>Pick your favorite game and start playing!</p>
  <ul>
    <li><a href="tic-tac-toe.html">🎲 Play Tic Tac Toe</a></li>
    <li><a href="memory.html">🃏 Play Memory Card</a></li>
    <li><a href="snake.html">🐍 Play Snake Game</a></li>
    <li><a href="2048.html">🔢 Play 2048</a></li>
    <li><a href="sudoku.html">🧩 Play Sudoku</a></li>
  </ul>
</body>
</html>
