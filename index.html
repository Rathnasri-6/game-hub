<!DOCTYPE html>
<html>
<head>
  <title>Rathnasri's Comic Game Hub</title>
  <style>
    body {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: #fefefe;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    h1 {
      font-size: 3em;
      color: #222;
      padding: 20px;
      background: #ffeb3b;
      border: 5px solid #000;
      display: inline-block;
      margin-top: 30px;
      box-shadow: 5px 5px 0 #000;
      transform: rotate(-2deg);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 25px;
      padding: 40px;
      max-width: 1000px;
      margin: auto;
    }
    .card {
      background: #fff;
      border: 4px solid #000;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 6px 6px 0 #000;
      transition: transform 0.3s;
      cursor: pointer;
    }
    .card:hover {
      transform: scale(1.1) rotate(-3deg);
    }
    .card a {
      text-decoration: none;
      color: #000;
      font-size: 1.3em;
      font-weight: bold;
      display: block;
      margin-top: 10px;
    }
    .emoji {
      font-size: 3em;
    }
  </style>
</head>
<body>
  <h1> ⚔️ Rathnasri's Comic Game Hub ⚔️</h1>
  <div class="grid">
    <div class="card">
      <div class="emoji">🎲</div>
      <a href="tic-tac-toe.html">Play Tic Tac Toe</a>
    </div>
    <div class="card">
      <div class="emoji">🃏</div>
      <a href="memory.html">Play Memory Card</a>
    </div>
    <div class="card">
      <div class="emoji">🐍</div>
      <a href="snake.html">Play Snake Game</a>
    </div>
    <div class="card">
      <div class="emoji">🔢</div>
      <a href="2048.html">Play 2048</a>
    </div>
    <div class="card">
      <div class="emoji">🧩</div>
      <a href="sudoku.html">Play Sudoku</a>
    </div>
  </div>
</body>
</html>
