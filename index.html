<!DOCTYPE html>
<html>
<head>
  <title>Rathnasri's Game Hub</title>
  <style>
    body {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: linear-gradient(135deg, #dbe6f6, #c5796d);
      margin: 0; padding: 0; text-align: center;
      animation: fadeIn 1s ease;
    }
    @keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} }
    h1 { font-size: 3em; color: #222; margin-top: 30px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 25px; padding: 40px; max-width: 1000px; margin: auto;
    }
    .card {
      background: #fff; border-radius: 15px; padding: 20px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-10px);
      box-shadow: 0 12px 25px rgba(0,0,0,0.3);
    }
    .card a {
      text-decoration: none; color: #333;
      font-size: 1.3em; font-weight: bold; display: block; margin-top: 10px;
    }
    .emoji { font-size: 3em; }
  </style>
</head>
<body>
  <h1>Rathnasri's Game Hub</h1>
  <div class="grid">
    <div class="card"><div class="emoji">🎲</div><a href="tic-tac-toe.html">Play Tic Tac Toe</a></div>
    <div class="card"><div class="emoji">🃏</div><a href="memory.html">Play Memory Card</a></div>
    <div class="card"><div class="emoji">🐍</div><a href="snake.html">Play Snake Game</a></div>
    <div class="card"><div class="emoji">🔢</div><a href="2048.html">Play 2048</a></div>
    <div class="card"><div class="emoji">🧩</div><a href="sudoku.html">Play Sudoku</a></div>
  </div>
</body>
</html>
