<!DOCTYPE html>
<html>
<head>
  <title>Rathnasri's Ultimate Game Hub</title>
  <style>
    body {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: linear-gradient(270deg, #ff6a00, #ffcc00, #ff0099, #00dbde, #fc00ff);
      background-size: 1000% 1000%;
      animation: rainbowBG 20s ease infinite;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    @keyframes rainbowBG {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }
    h1 {
      color: #fff;
      font-size: 3em;
      padding: 20px;
      text-shadow: 0 0 15px #ff00ff, 0 0 30px #00ffff;
      animation: glow 2s ease-in-out infinite alternate;
    }
    @keyframes glow {
      from {text-shadow: 0 0 10px #ff00ff;}
      to {text-shadow: 0 0 30px #00ffff;}
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 25px;
      padding: 40px;
      max-width: 1000px;
      margin: auto;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
      transition: transform 0.4s, box-shadow 0.4s;
      cursor: pointer;
    }
    .card:hover {
      transform: scale(1.1) rotate(-3deg);
      box-shadow: 0 0 25px #fff, 0 0 50px #ff00ff;
    }
    .card a {
      text-decoration: none;
      color: #333;
      font-size: 1.3em;
      font-weight: bold;
      display: block;
      margin-top: 10px;
    }
    .emoji {
      font-size: 3em;
    }
  </style>
</head>
<body>
  <h1>🎡 Rathnasri's Ultimate Game Hub 🎮</h1>
  <div class="grid">
    <div class="card">
      <div class="emoji">🎲</div>
      <a href="tic-tac-toe.html">Play Tic Tac Toe</a>
    </div>
    <div class="card">
      <div class="emoji">🃏</div>
      <a href="memory.html">Play Memory Card</a>
    </div>
    <div class="card">
      <div class="emoji">🐍</div>
      <a href="snake.html">Play Snake Game</a>
    </div>
    <div class="card">
      <div class="emoji">🔢</div>
      <a href="2048.html">Play 2048</a>
    </div>
    <div class="card">
      <div class="emoji">🧩</div>
      <a href="sudoku.html">Play Sudoku</a>
    </div>
  </div>
</body>
</html>
