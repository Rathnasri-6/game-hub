<!DOCTYPE html>
<html>
<head>
  <title>Tic Tac Toe</title>
  <style>
    body {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: radial-gradient(circle, #fff 20%, #f0f0f0 20%);
      background-size: 25px 25px;
      text-align: center;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    h1 {
      font-size: 3em;
      color: #222;
      padding: 20px;
      background: #ffeb3b;
      border: 5px solid #000;
      display: inline-block;
      margin-top: 20px;
      box-shadow: 5px 5px 0 #000;
      transform: rotate(-2deg);
    }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 120px);
      grid-gap: 15px;
      justify-content: center;
      margin-top: 30px;
      position: relative;
    }
    .cell {
      width: 120px;
      height: 120px;
      background: #fff;
      font-size: 2.5em;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 4px solid #000;
      border-radius: 10px;
      box-shadow: 4px 4px 0 #000;
      transition: transform 0.2s;
    }
    .cell:hover { transform: scale(1.1) rotate(-3deg); }
    .X { color: #2196F3; font-weight: bold; }
    .O { color: #E91E63; font-weight: bold; }
    .line {
      position: absolute;
      height: 6px;
      background: #000;
      border-radius: 3px;
      transform-origin: center;
    }
    .popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #ffeb3b;
      color: #000;
      padding: 25px 40px;
      border: 5px solid #000;
      border-radius: 15px;
      font-size: 1.8em;
      box-shadow: 6px 6px 0 #000;
      z-index: 1000;
    }
    .popup button {
      margin-top: 15px;
      padding: 10px 20px;
      border: 3px solid #000;
      border-radius: 10px;
      background: #2196F3;
      color: #fff;
      font-size: 1em;
      cursor: pointer;
      box-shadow: 4px 4px 0 #000;
    }
    .popup button:hover { background: #1976D2; }
    .blast {
      position: fixed;
      font-size: 3em;
      font-weight: bold;
      color: red;
      animation: explode 1s ease forwards;
      z-index: 999;
    }
    @keyframes explode {
      0% {transform: scale(0.5) rotate(0deg); opacity: 0;}
      50% {transform: scale(1.5) rotate(20deg); opacity: 1;}
      100% {transform: scale(0) rotate(-20deg); opacity: 0;}
    }
    a {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      color: #000;
      background: #ff5722;
      padding: 10px 25px;
      border-radius: 30px;
      font-size: 1.1em;
      border: 3px solid #000;
      box-shadow: 4px 4px 0 #000;
      transition: transform 0.3s;
    }
    a:hover { transform: scale(1.1) rotate(-3deg); }
  </style>
</head>
<body>
  <h1>💥 Tic Tac Toe 💥</h1>
  <div class="board" id="board"></div>
  <a href="index.html">⬅ Back to Menu</a>

  <script>
    const board = document.getElementById("board");
    let currentPlayer = "X";
    let cells = Array(9).fill(null);

    const wins = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    function showPopup(text) {
      const popup = document.createElement("div");
      popup.className = "popup";
      popup.innerHTML = text + "<br><button onclick='location.reload()'>Play Again</button>";
      document.body.appendChild(popup);
      launchBlast("💥 BOOM!");
      launchBlast("🏆 WIN!");
    }

    function launchBlast(text) {
      const blast = document.createElement("div");
      blast.className = "blast";
      blast.textContent = text;
      blast.style.left = Math.random() * window.innerWidth + "px";
