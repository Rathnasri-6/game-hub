<!DOCTYPE html>
<html>
<head>
  <title>Tic Tac Toe</title>
  <style>
    body {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: #fefefe;
      text-align: center;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    h1 {
      font-size: 3em;
      color: #222;
      padding: 20px;
      background: #ffeb3b;
      border: 5px solid #000;
      display: inline-block;
      margin-top: 20px;
      box-shadow: 5px 5px 0 #000;
      transform: rotate(-2deg);
    }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 120px);
      grid-gap: 15px;
      justify-content: center;
      margin-top: 30px;
      position: relative;
    }
    .cell {
      width: 120px;
      height: 120px;
      background: #fff;
      font-size: 2.5em;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 4px solid #000;
      border-radius: 10px;
      box-shadow: 4px 4px 0 #000;
      transition: transform 0.2s;
    }
    .cell:hover { transform: scale(1.1) rotate(-3deg); }
    .X { color: #2196F3; font-weight: bold; }
    .O { color: #E91E63; font-weight: bold; }
    .line {
      position: absolute;
      height: 6px;
      background: #000;
      border-radius: 3px;
      transform-origin: center;
    }
    .popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #ffeb3b;
      color: #000;
      padding: 25px 40px;
      border: 5px solid #000;
      border-radius: 15px;
      font-size: 1.8em;
      box-shadow: 6px 6px 0 #000;
      z-index: 1000;
    }
    .popup button {
      margin-top: 15px;
      padding: 10px 20px;
      border: 3px solid #000;
      border-radius: 10px;
      background: #2196F3;
      color: #fff;
      font-size: 1em;
      cursor: pointer;
      box-shadow: 4px 4px 0 #000;
    }
    .popup button:hover { background: #1976D2; }
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      background: red;
      animation: fall 3s linear forwards;
      z-index: 999;
    }
    @keyframes fall {
      0% {transform: translateY(-100vh);}
      100% {transform: translateY(100vh);}
    }
    a {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      color: #000;
      background: #ff5722;
      padding: 10px 25px;
      border-radius: 30px;
      font-size: 1.1em;
      border: 3px solid #000;
      box-shadow: 4px 4px 0 #000;
      transition: transform 0.3s;
    }
    a:hover { transform: scale(1.1) rotate(-3deg); }
  </style>
</head>
<body>
  <h1>💥 Tic Tac Toe 💥</h1>
  <div class="board" id="board"></div>
  <a href="index.html">⬅ Back to Menu</a>

  <script>
    const board = document.getElementById("board");
    let currentPlayer = "X";
    let cells = Array(9).fill(null);

    const wins = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    function showPopup(text) {
      const popup = document.createElement("div");
      popup.className = "popup";
      popup.innerHTML = text + "<br><button onclick='location.reload()'>Play Again</button>";
      document.body.appendChild(popup);
      launchConfetti();
    }

    function launchConfetti() {
      for (let i = 0; i < 50; i++) {
        const confetti = document.createElement("div");
        confetti.className = "confetti";
        confetti.style.left = Math.random() * window.innerWidth + "px";
        confetti.style.background = `hsl(${Math.random()*360},100%,50%)`;
        confetti.style.animationDuration = (Math.random()*2+2) + "s";
        document.body.appendChild(confetti);
        setTimeout(() => confetti.remove(), 3000);
      }
    }

    function checkWinner() {
      for (let combo of wins) {
        const [a,b,c] = combo;
        if (cells[a] && cells[a] === cells[b] && cells[a] === cells[c]) {
          drawLine(combo);
          showPopup(cells[a] + " Wins!");
          return cells[a];
        }
      }
      if (cells.every(cell => cell)) {
        showPopup("It's a Draw!");
        return "Draw";
      }
      return null;
    }

    function drawLine(combo) {
      const positions = combo.map(i => board.children[i].getBoundingClientRect());
      const boardRect = board.getBoundingClientRect();
      const x1 = positions[0].left + positions[0].width/2 - boardRect.left;
      const y1 = positions[0].top + positions[0].height/2 - boardRect.top;
      const x2 = positions[2].left + positions[2].width/2 - boardRect.left;
      const y2 = positions[2].top + positions[2].height/2 - boardRect.top;

      const line = document.createElement("div");
      line.className = "line";
      const length = Math.sqrt((x2-x1)**2 + (y2-y1)**2);
      line.style.width = length + "px";
      line.style.left = (x1 + x2)/2 - length/2 + "px";
      line.style.top = (y1 + y2)/2 + "px";
      const angle = Math.atan2(y2-y1, x2-x1) * 180/Math.PI;
      line.style.transform = `rotate(${angle}deg)`;
      board.appendChild(line);
    }

    function handleClick(i, cell) {
      if (!cells[i]) {
        cells[i] = currentPlayer;
        cell.textContent = currentPlayer;
        cell.classList.add(currentPlayer);
        const winner = checkWinner();
        if (!winner) {
          currentPlayer = currentPlayer === "X" ? "O" : "X";
        } else {
          board.querySelectorAll(".cell").forEach(c => c.style.pointerEvents = "none");
        }
      }
    }

    for (let i = 0; i < 9; i++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.addEventListener("click", () => handleClick(i, cell));
      board.appendChild(cell);
    }
  </script>
</body>
</html>
