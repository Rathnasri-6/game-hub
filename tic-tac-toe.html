<!DOCTYPE html>
<html>
<head>
  <title>Tic Tac Toe</title>
  <style>
    body {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb, #a1c4fd, #c2e9fb);
      text-align: center;
      margin: 0;
      padding: 0;
    }
    h1 {
      color: #fff;
      text-shadow: 3px 3px 8px #000;
      padding: 20px;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 120px);
      grid-gap: 15px;
      justify-content: center;
      margin-top: 30px;
      position: relative;
    }
    .cell {
      width: 120px;
      height: 120px;
      background: #fff;
      font-size: 2.5em;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      transition: transform 0.3s, background 0.3s;
    }
    .cell:hover {
      transform: scale(1.1) rotate(-3deg);
      background: #ffcccb;
    }
    .X {
      color: #2196F3; /* Bright Blue */
      font-weight: bold;
    }
    .O {
      color: #E91E63; /* Hot Pink */
      font-weight: bold;
    }
    .line {
      position: absolute;
      height: 12px;
      background: yellow;
      border-radius: 6px;
      box-shadow: 0 0 15px #ff0;
      transform-origin: center;
    }
    .popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: linear-gradient(45deg, #ff6a00, #ffcc00, #ff0099, #00dbde, #fc00ff);
      color: #fff;
      padding: 20px 40px;
      border-radius: 20px;
      font-size: 2em;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
      animation: pop 0.5s ease;
    }
    @keyframes pop {
      from { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
      to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }
    a {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(45deg, #43cea2, #185a9d);
      padding: 10px 25px;
      border-radius: 30px;
      font-size: 1.1em;
      transition: transform 0.3s;
    }
    a:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <h1>🌈 Tic Tac Toe 🌈</h1>
  <div class="board" id="board"></div>
  <a href="index.html">⬅ Back to Menu</a>

  <script>
    const board = document.getElementById("board");
    let currentPlayer = "X";
    let cells = Array(9).fill(null);

    const wins = [
      [0,1,2],[3,4,5],[6,7,8], // rows
      [0,3,6],[1,4,7],[2,5,8], // cols
      [0,4,8],[2,4,6]          // diagonals
    ];

    function showPopup(text) {
      const popup = document.createElement("div");
      popup.className = "popup";
      popup.textContent = text;
      document.body.appendChild(popup);
      setTimeout(() => popup.remove(), 2000);
    }

    function checkWinner() {
      for (let combo of wins) {
        const [a,b,c] = combo;
        if (cells[a] && cells[a] === cells[b] && cells[a] === cells[c]) {
          drawLine(combo);
          showPopup(cells[a] + " Wins!");
          return cells[a];
        }
      }
      if (cells.every(cell => cell)) {
        showPopup("It's a Draw!");
        return "Draw";
      }
      return null;
    }

    function drawLine(combo) {
      const positions = combo.map(i => board.children[i].getBoundingClientRect());
      const boardRect = board.getBoundingClientRect();
      const x1 = positions[0].left + positions[0].width/2 - boardRect.left;
      const y1 = positions[0].top + positions[0].height/2 - boardRect.top;
      const x2 = positions[2].left + positions[2].width/2 - boardRect.left;
      const y2 = positions[2].top + positions[2].height/2 - boardRect.top;

      const line = document.createElement("div");
      line.className = "line";
      const length = Math.sqrt((x2-x1)**2 + (y2-y1)**2);
      line.style.width = length + "px";
      line.style.left = (x1 + x2)/2 - length/2 + "px";
      line.style.top = (y1 + y2)/2 + "px";
      const angle = Math.atan2(y2-y1, x2-x1) * 180/Math.PI;
      line.style.transform = `rotate(${angle}deg)`;
      board.appendChild(line);
    }

    function handleClick(i, cell) {
      if (!cells[i]) {
        cells[i] = currentPlayer;
        cell.textContent = currentPlayer;
        cell.classList.add(currentPlayer);
        const winner = checkWinner();
        if (!winner) {
          currentPlayer = currentPlayer === "X" ? "O" : "X";
        } else {
          board.querySelectorAll(".cell").forEach(c => c.style.pointerEvents = "none");
        }
      }
    }

    for (let i = 0; i < 9; i++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.addEventListener("click", () => handleClick(i, cell));
      board.appendChild(cell);
    }
  </script>
</body>
</html>
